name: startfront_app
description: StartFront - Professional Flutter Web SPA Dashboard
version: 0.0.1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.70.0
  flutter_colorpicker: ^1.1.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_flavorizr: ^2.2.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

flavorizr:
  app:
    name: "StartFront"

  flavors:
    dev:
      app:
        name: "StartFront Dev"
      android:
        applicationId: "com.startfront.dev"
      ios:
        bundleId: "com.startfront.dev"
    uat:
      app:
        name: "StartFront UAT"
      android:
        applicationId: "com.startfront.uat"
      ios:
        bundleId: "com.startfront.uat"
    prod:
      app:
        name: "StartFront"
      android:
        applicationId: "com.startfront"
      ios:
        bundleId: "com.startfront"
