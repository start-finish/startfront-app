name: startfront_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  get_cli: ^1.8.1
  dio: ^5.8.0+1
  get: ^4.7.2
  shared_preferences: ^2.5.3
  touch_ripple_effect: ^2.5.3
  cached_network_image: ^3.4.1
  loading_indicator: ^3.1.1
  encrypt: ^5.0.3
  either_dart: ^1.0.0
  flutter_easyloading: ^3.0.5
  connectivity_plus: ^6.1.4
  internet_connection_checker_plus: ^2.7.2
  web_socket_channel: ^3.0.3
  auto_launcher: ^0.0.4
  flexible_wrap: ^1.0.6
  flutter_svg: ^2.1.0
  animated_custom_dropdown: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/svg/

auto_launcher:
  app_name:
    enable: true
    build: "StartFront"
  version:
    enable: true
    build: "0.1.0+2"
  bundle_id:
    platforms:
      android:
        enable: true
        build: "com.startfront.android"
      ios:
        enable: true
        build: "com.startfront.ios"
  icon:
    enable: true
    image_path: "assets/logo/StartFinish_logo.png"
    platforms:
      android:
        enable: true
      ios:
        enable: true

### run this ###
# dart run auto_launcher #
