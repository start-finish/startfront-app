<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="StartFront - Professional Admin Dashboard SPA built with Flutter">
  <meta name="theme-color" content="#001F3F">

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StartFront">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>StartFront Dashboard</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading splash while Flutter initializes */
    body {
      margin: 0;
      padding: 0;
      background-color: #001F3F;
      overflow: hidden;
    }
    .loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #001F3F;
      z-index: 9999;
      font-family: 'Inter', sans-serif;
      transition: opacity 0.4s ease;
    }
    .loading-splash .logo {
      font-size: 32px;
      font-weight: 900;
      color: #00D2D2;
      letter-spacing: 3px;
      margin-bottom: 24px;
    }
    .loading-splash .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(0, 210, 210, 0.2);
      border-top: 2px solid #00D2D2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-splash">
    <div class="logo">STARTFRONT</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Remove loading splash once Flutter renders
    window.addEventListener('flutter-first-frame', function() {
      const splash = document.getElementById('loading');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
